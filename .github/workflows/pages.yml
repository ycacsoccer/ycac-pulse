# The gate: verify → build → deploy → smoke.
# A red verify stops the run here, which means the GitHub Pages artifact is
# never uploaded and the site is never republished (Pages is set to deploy
# from GitHub Actions, not from the branch).
name: verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # check:syntax → unit tests → the 5 secret-free verifiers → Playwright E2E.
      # The 9 service-key suites (they create ephemeral users and write rows)
      # stay local: `npm run verify:live` on the machine that holds .env.
      - name: Verify
        run: npm run verify

      - name: Upload Playwright report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Build the publishable site (whitelisted files only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build:site -- --sha "${{ github.sha }}"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Polls build-info.json until the published commit matches, then walks
      # the public pages: live data, no attendance surface, no overflow, and
      # team pages still gated.
      - name: Smoke test the published site
        env:
          SMOKE_COMMIT: ${{ github.sha }}
        run: npm run test:smoke

      - name: Upload smoke report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
