<!doctype html>
<html lang="en" data-i18n-title="matchTitle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YC&AC Pulse fixture and result details: match information, lineup, scorers and assists." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#112950" />
    <link rel="icon" href="https://ycac.jp/wp-content/uploads/2025/10/YCAC-Logo-Icon.png" type="image/png" />
    <title>YC&AC Pulse | Match review</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="masthead">
      <a class="club-mark" href="./" aria-label="YC&AC Pulse home"><img src="https://ycac.jp/wp-content/uploads/2025/10/YCAC-Logo-Icon.png" alt="YC&AC" /></a>
      <div class="brand"><span>YC&amp;AC</span> Pulse<small data-i18n="officialWebsite">Official Soccer Top Team · Est. 1868</small></div>
      <a class="back-link" href="./" data-i18n="loginHome">Back to season</a>
      <span data-auth-slot></span>
      <label class="lang-switch"><select id="lang-select" data-lang-select aria-label="Language"></select></label>
    </header>

    <main class="coach-main match-main">
      <section id="match-hero" class="match-hero" aria-live="polite"></section>

      <section id="lineup-panel" class="panel match-panel">
        <div class="section-heading"><div><h2 data-i18n="matchLineup">Lineup</h2></div></div>
        <div id="match-lineup"></div>
      </section>

      <section id="goals-panel" class="panel match-panel">
        <div class="section-heading"><div><h2 data-i18n="statGoals">Goals</h2></div></div>
        <div id="match-goals"></div>
      </section>

      <section id="signups-panel" class="panel match-panel" hidden>
        <div class="section-heading"><div><h2 data-i18n="coachSignups">Signups</h2></div></div>
        <div id="match-signups"></div>
      </section>

      <section id="notes-panel" class="panel match-panel" hidden>
        <div class="section-heading"><div><h2 data-i18n="matchReview">Coach's review</h2></div></div>
        <div id="match-notes"></div>
      </section>
    </main>

    <footer><span data-i18n="footer">YC&amp;AC Pulse · Official Top Team of Yokohama Country &amp; Athletic Club</span> <a href="https://ycac.jp" target="_blank" rel="noreferrer">ycac.jp</a></footer>
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="match.js"></script>
  </body>
</html>
